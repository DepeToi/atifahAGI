# mood-service 独立部署。前置条件：
#   1. 仓库根目录已执行 mvn clean package -DskipTests；
#   2. 中间件已通过 deploy/docker-compose/docker-compose.yml 启动（网络 atifah-net）；
#   3. Nacos 已发布 common-application.yaml。
#
# 构建并启动：docker compose -f atifah-services/mood-service/docker-compose.yml up -d --build
# 查看日志：  docker compose -f atifah-services/mood-service/docker-compose.yml logs -f
# 停止清理：  docker compose -f atifah-services/mood-service/docker-compose.yml down
#
# 与 deploy/docker-compose/docker-compose.app.yml 复用同一份模块 Dockerfile；
# 镜像 tag、容器名、端口与统一编排一致，同一个服务不能同时用两种方式运行。
name: atifah-mood-service

services:
  mood-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-eclipse-temurin:21-jre-jammy}
    image: atifah/mood-service:local
    container_name: atifah-mood
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-1g}
    # 日志落宿主机仓库根 logs/；运行 UID/GID 必须与该目录属主一致（Linux 用 id -u / id -g 查看）
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ../../logs:/app/logs
    # 内部服务不发布宿主机端口，外部统一经 gateway 访问。
    expose:
      - "8083"
    command:
      - --spring.profiles.active=container,local
    networks:
      - atifah-net

networks:
  atifah-net:
    external: true
