# gitleaks 配置：扩展默认规则，仅放行已确认安全的占位值
# 维护约定：新增放行项必须注明来源提交与原因（SEC-02：禁止放行真实密钥）
# 注意：extend + fingerprints 组合在 8.24.3 不生效，因此按密文正则精确放行
[extend]
useDefault = true

[allowlist]
description = "历史误报：仓库重建前的工作区（来源提交号已不可达）中用于 compose 语法校验的 base64 哑变量（明文为 ci-dummy-nacos-token-for-syntax-check-0123456789），非真实密钥；现行 ci-gates.sh 已改用 dummy-token"
regexTarget = "secret"
regexes = [
  '''Y2ktZHVtbXktbmFjb3MtdG9rZW4tZm9yLXN5bnRheC1jaGVjay0wMTIzNDU2Nzg5''',
  # 8f61201：SEC-02 设计内的仓库开发哑主密钥（SecretPropertySourceScanner.DEV_MASTER_KEY，
  # 各服务 application.yml / 网关 / Nacos 公共配置兜底值），只解密仓库内哑密文，
  # 生产从 Nacos 下发真实主密钥且兜底取到该值会拒绝启动；非真实密钥
  '''Vct5lyW9M9uW9GltsCt7V41lWIzO6JNugYRTVMw1Li0=''',
  # 8f61201：GatewayApplicationContextTest 测试 profile 的明文哑 JWT 密钥（HS256 ≥32 字节占位），非真实密钥
  '''jwt-test-secret-0123456789012345678901''',
]
